name: CI

# --- トリガー ---
on:
  push:
    paths:
      - "**"
    branches:
      - main
      - develop
      - "feat/**"

  pull_request:
    paths:
      - "**"
    branches: [main, develop]

# --- ジョブ ---
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # --- 依存関係のチェック ---
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Create virtual environment with uv
        working-directory: ./src
        run: |
          uv venv .venv

      - name: Install dependencies
        working-directory: ./src
        run: |
          uv add -r requirements.txt
          uv pip list

      # --- Lintチェック ---
      - name: Lint check with ruff (core, orchestrate, strategy, research, recommend, shared, main.py)
        working-directory: ./src
        run: |
          uv run ruff check core
          uv run ruff check orchestrate
          uv run ruff check strategy
          uv run ruff check research
          uv run ruff check recommend
          uv run ruff check shared
          uv run ruff check main.py

      # --- 型チェック ---
      - name: Type check with ty (core, orchestrate, strategy, research, recommend, shared, main.py)
        working-directory: ./src
        run: |
          uv run ty check core
          uv run ty check orchestrate
          uv run ty check strategy
          uv run ty check research
          uv run ty check recommend
          uv run ty check shared
          uv run ty check main.py
